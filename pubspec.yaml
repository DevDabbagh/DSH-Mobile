name: dsh_mobile
description: Don't Skip Humanity - Mobile Application
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Backend — Supabase is the default for every DSH content table.
  supabase_flutter: ^2.8.0

  # Push notifications. Firebase is here for messaging only — no Firestore,
  # no Firebase Auth; the account and the data stay in Supabase.
  # flutter_local_notifications draws the banner while the app is in the
  # foreground, which neither Android nor iOS does on its own.
  firebase_core: ^3.15.0
  firebase_messaging: ^15.2.0
  flutter_local_notifications: ^18.0.1

  # Networking — kept for third-party APIs (Stripe etc.), not for Supabase.
  dio: ^5.4.0
  # Declared directly, not left transitive: NetLogger implements
  # `http.BaseClient` to wrap the client Supabase uses, so this package is now
  # part of our own API surface rather than an implementation detail of the
  # SDK's. Left undeclared, an SDK upgrade could move it under us.
  http: ^1.2.0
  retrofit: ">=4.6.0 <4.9.0"
  dio_http_formatter: ^3.0.0

  # Functional Programming
  dartz: ^0.10.1
  equatable: ^2.0.5

  # Navigation
  go_router: ^14.0.0

  # Storage
  shared_preferences: ^2.5.3

  # Utils
  intl: ^0.20.2
  connectivity_plus: ^6.0.0
  cached_network_image: ^3.3.1
  flutter_screenutil: ^5.9.0

  # UI
  flutter_svg: ^2.2.3
  google_fonts: ^6.3.2
  shimmer: ^3.0.0
  json_annotation: ^4.9.0
  url_launcher: ^6.2.0
  # Stripe Checkout runs inside the app so the donor returns to the app when
  # they are done, rather than being left in a browser tab.
  webview_flutter: ^4.10.0
  smooth_page_indicator: ^1.1.0
  pinput: ^6.0.2
  video_player: ^2.9.2
  table_calendar: ^3.2.1
  flutter_native_splash: ^2.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  riverpod_generator: ^2.6.4
  retrofit_generator: ^9.7.0
  json_serializable: ^6.7.1
  freezed: ^2.5.7
  freezed_annotation: ^2.4.4
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/logoForAppIcon_padded.png"
  adaptive_icon_background: "#0A0A0A"
  adaptive_icon_foreground: "assets/logoForAppIcon_padded.png"
  min_sdk_android: 21
  remove_alpha_ios: true

# flutter_gen:
#   output: lib/app/config/
#   line_length: 80
#   integrations:
#     flutter_svg: true

flutter_native_splash:
  color: "#0A0A0A"
  image: assets/icons/ic_logo.png
  android_12:
    image: assets/icons/ic_logo_android12.png
    color: "#0A0A0A"
    icon_background_color: "#0A0A0A"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/videos/
    - assets/translations/
